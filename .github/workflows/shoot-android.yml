# SPDX-License-Identifier: AGPL-3.0-only
name: shoot android

# The same picture, but off an Android: what Xvfb draws is what a machine
# with no GPU at all draws, at this screen's own density, on this machine's
# own fonts. Whether a corner comes out round is one thing everywhere; how
# it reads to an eye on a phone is another, and only a frame an Android
# itself drew says that. So the program is built for the emulator's own ABI,
# put in it, started in it, and shot there.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-home
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-home
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
      ABI: x86_64
      API: '34'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/desktop-setup
      # Hardware acceleration: the emulator is given /dev/kvm and the user
      # is let at it, which is what GitHub asks be done by hand -- without
      # it an x86 guest is translated instruction by instruction, and boots
      # for longer than a run is given.
      - name: Let the runner at kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # Android's own tools, and one image of one release run in them. Say
      # "yes" to every licence asked for rather than standing on one.
      - name: Android's own tools
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          tools=commandlinetools-linux-13114758_latest.zip
          curl -sSfLo cmdline.zip "https://dl.google.com/android/repository/$tools"
          unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # Say yes to every licence asked for: `yes` writing into a closed
          # pipe is a death by signal, and `set -o pipefail` reads that as
          # an answer of its own -- so its end is forgiven here, and only
          # what sdkmanager said is what this step comes to.
          { yes || true; } | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" "emulator" "platforms;android-$API" \
            "build-tools;$API.0.0" "system-images;android-$API;google_apis;$ABI"
          sdkmanager --list_installed
      # A device of its own kind in front of the emulator: a phone's screen,
      # so what is drawn is drawn narrow as it is on a phone.
      - name: A device to be this one
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force \
            --name shot \
            --package "system-images;android-$API;google_apis;$ABI" \
            --device pixel_6
          # Where it wrote it is for it to know and for the emulator below
          # to agree on: rather than guess which of the homes it answered
          # to, what it wrote is found wherever it wrote it, and that place
          # is what the emulator is then told to look in.
          found=$(find "$HOME" "$ANDROID_AVD_HOME" -maxdepth 6 -name shot.ini -print -quit)
          echo "== what avdmanager wrote =="
          echo "$found"
          avd_home=$(dirname "$found")
          echo "ANDROID_AVD_HOME=$avd_home" >> "$GITHUB_ENV"
          ls -l "$avd_home"
      # What an emulator is linked against and a machine of this kind may
      # not have come with: without them it writes a complaint nobody reads
      # and goes on its way, and there is nothing left for the step below
      # to wait for.
      - name: What the emulator needs of the machine
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libnss3 libx11-xcb1 libxcb-dri3-0 \
            libxcursor1 libxi6 libxtst6 libpulse0 || true
      # Started before the long build rather than after it: a picture of the
      # home screen says the emulator came up at all, and says it before
      # three quarters of an hour has been spent building into one that
      # has not.
      - name: Bring it up
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/emulator/emulator" -version | head -3 || true
          nohup "$ANDROID_HOME/emulator/emulator" @shot \
            -no-window -no-boot-anim -no-audio -no-snapshot -gpu swiftshader_indirect \
            -memory 4096 -cores 4 >emulator.txt 2>&1 &
          # Nothing waits without an end: an adb asked of a device that is
          # not up yet answers nothing at all and hangs on that until the
          # whole run is out of time, so every asking is given how long it
          # may take, and what could not be brought up says why rather than
          # saying nothing.
          timeout 60 adb wait-for-device || true
          up() {
            [ "$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]
          }
          for at in $(seq 1 40); do up && break; sleep 5; done
          if ! up; then
            echo "== what the emulator wrote =="
            tail -40 emulator.txt || true
            echo "== what adb sees =="
            timeout 20 adb devices -l || true
            echo "== what the machine has for it =="
            timeout 20 ls -l /dev/kvm || true
            exit 1
          fi
          timeout 15 adb shell getprop ro.build.version.release
          timeout 15 adb shell wm dismiss-keyguard || true
          timeout 30 adb exec-out screencap -p > shot_home.png
          timeout 15 adb shell wm size
          timeout 15 adb shell wm density
          ls -l shot_home.png
      - uses: actions/upload-artifact@v4
        with:
          name: shot-android-home
          path: shot_home.png
          if-no-files-found: error
      - uses: ./.github/actions/android-setup
        with:
          abi: ${{ env.ABI }}
      - uses: actions/cache@v4
        with:
          path: build-android-shot
          key: shoot-android-${{ env.ABI }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/shoot-android.yml', '.github/actions/android-setup/action.yml') }}
      - name: Configure
        run: |
          cmake -S . -B build-android-shot -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG='-O3 -g0' \
            -DCMAKE_C_FLAGS_DEBUG='-O3 -g0' \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/.cache/pchat-android-${{ env.ABI }}/cmake/target.cmake" \
            -DANDROID_ABI=${{ env.ABI }} \
            -DANDROID_PLATFORM=android-28 \
            -DPCHAT_ANDROID_SDL_DEX_DIR="$HOME/pchat-tools/sdl-dex/build-scripts/native-activity/dex" \
            -DPCHAT_REVISION="$(git rev-parse --short=12 HEAD)" \
            -DPCHAT_TESTS=OFF
      - name: Nothing packaged before
        run: |
          rm -f build-android-shot/progressive-chat-*-${{ env.ABI }}.apk \
                build-android-shot/progressive-chat-*-${{ env.ABI }}-unsigned.apk
      - name: Build and package
        run: |
          cmake --build build-android-shot --target progressive-chat -- -k 0
          cmake --build build-android-shot --target progressive-chat-apk-out
          ls -l build-android-shot/*.apk
      # Put in the device already up, started in it, and shot again and
      # again on the way: what the first frame draws may not be what the
      # tenth does, and a program that went has still said something in
      # logcat about where it went.
      - name: Put it in and shoot what it drew
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          # Up still? A background process of a step that has ended is not
          # always one of the step after it, so it is asked again, and
          # brought up again where it is not.
          up() { [ "$(timeout 15 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; }
          if ! up; then
            nohup "$ANDROID_HOME/emulator/emulator" @shot \
              -no-window -no-boot-anim -no-audio -no-snapshot -gpu swiftshader_indirect \
              -memory 4096 -cores 4 >>emulator.txt 2>&1 &
            timeout 60 adb wait-for-device || true
            for at in $(seq 1 40); do up && break; sleep 5; done
          fi
          up || { echo "the emulator never came up"; tail -40 emulator.txt; exit 1; }
          adb install -r build-android-shot/progressive-chat-*-${{ env.ABI }}.apk
          adb shell am start -n chat.progressive.client/org.libsdl.nativeapp.NativeActivity
          for at in 1 2 3 4 5 6; do
            sleep 5
            adb exec-out screencap -p > "shot_${at}.png"
          done
          adb logcat -d > android.txt
          tail -40 android.txt || true
          ls -l shot_*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-android
          path: |
            shot_*.png
            android.txt
            emulator.txt
          if-no-files-found: warn
